<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hyperliquid Mainnet · PnL Calendar</title>
<style>
:root{--bg:#000;--bg2:#0b0b0b;--panel:#0e0e0e;--border:#1a1a1a;--border2:#262626;--text:#e8e8e8;--muted:#8b8b8b;--dim:#5c5c5c;
--green:#00c805;--red:#ff4d4f;--amber:#e6c07b;--accent:#6ea8fe;
--mono:"SF Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"Inter","IBM Plex Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}.dim{color:var(--dim)}.amber{color:var(--amber)}
.topbar{display:flex;align-items:center;gap:1rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem}.mark{color:var(--green);font-size:1.2rem}
.brand-title{font-weight:650;font-size:14px}.brand-sub{color:var(--muted);font-size:10px;font-family:var(--mono)}
.badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:.2rem .5rem;border-radius:3px;border:1px solid #1a5c2a;color:var(--green);background:#06140a}
.badge.warn{border-color:#7a5a1a;color:var(--amber);background:#140e06}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 6px var(--green)}
.dot.stale{background:var(--amber);box-shadow:none}
.spacer{flex:1}.meta{color:var(--muted);font-size:11px;font-family:var(--mono)}
button{font-family:var(--mono);font-size:11px;background:#111;color:var(--text);border:1px solid var(--border2);border-radius:5px;padding:.3rem .6rem;cursor:pointer}
button:hover{border-color:#3a3a3a;background:#161616}
.wrap{max-width:1240px;margin:0 auto;padding:1rem 1.1rem 2.5rem;display:flex;flex-direction:column;gap:1rem}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.65rem}
@media(max-width:960px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.75rem .85rem}
.kpi .lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem}
.kpi .val{font-family:var(--mono);font-size:1.25rem;font-weight:650}.kpi .sub{color:var(--dim);font-size:10px;margin-top:.2rem;font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-bottom:1px solid var(--border);background:#0a0a0a}
.card-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card-b{padding:.85rem .9rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 120px;gap:6px}
@media(max-width:820px){.cal{grid-template-columns:repeat(7,minmax(0,1fr))}.wk{display:none!important}}
.dow{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:0 .3rem .2rem}
.cell{min-height:92px;border:1px solid var(--border);border-radius:6px;background:#0a0a0a;padding:.45rem .5rem;display:flex;flex-direction:column;gap:.2rem;position:relative}
.cell.out{opacity:.25}.cell.empty .pnl{color:var(--dim)}
.cell.has{cursor:pointer}.cell.has:hover{border-color:#3a3a3a;background:#111}
.cell.win{background:linear-gradient(180deg,#04160a 0%,#0a0a0a 100%);border-color:#123d1c}
.cell.loss{background:linear-gradient(180deg,#1a0809 0%,#0a0a0a 100%);border-color:#3d1418}
.cell.today{outline:1px solid var(--accent);outline-offset:-1px}
.cell .dn{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.cell.today .dn b{color:var(--accent)}
.cell .pnl{font-family:var(--mono);font-size:16px;font-weight:650;margin-top:auto}
.cell .cnt{font-family:var(--mono);font-size:10px;color:var(--dim)}
.cell .live{font-family:var(--mono);font-size:10px}
.wk{border:1px dashed var(--border2);border-radius:6px;padding:.45rem .5rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
.wk .l{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em}.wk .v{font-family:var(--mono);font-size:14px;font-weight:650}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:.42rem .5rem;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:#0a0a0a}
td.num,th.num{text-align:right;font-family:var(--mono)}tr:hover td{background:#111}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:.12rem .4rem;border-radius:999px;border:1px solid var(--border2)}
.pill.win{color:var(--green);border-color:#1a5c2a;background:#06140a}.pill.loss{color:var(--red);border-color:#7a3338;background:#1a0a0c}
.pill.be,.pill.open{color:var(--amber);border-color:#7a5a1a;background:#140e06}
.side-long{color:var(--green)}.side-short{color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(1180px,100%);background:#070707;border-left:1px solid var(--border2);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:.8rem;padding:.85rem 1rem;border-bottom:1px solid var(--border)}
.dr-h h3{margin:0;font-size:15px}.dr-b{overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.stat-row{display:flex;flex-wrap:wrap;gap:.75rem 1.4rem}
.stat-row .l{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.stat-row .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:.1rem}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
.drawer th,.drawer td{padding:.38rem .4rem;font-size:11.5px}
.drawer .rsub{display:block;font-size:9.5px}
.empty{color:var(--dim);padding:1rem;text-align:center}
.footer{color:var(--dim);font-size:11px;line-height:1.5}
.nav{display:flex;gap:.4rem;align-items:center;margin-left:auto}
.mon{font-family:var(--mono);font-size:13px;min-width:120px;text-align:center}
</style>
</head>

/* ---------- live build (same logic as build_calendar_pnl.py) ---------- */
async function q(body){ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); if(!r.ok) throw new Error("HL "+r.status); return r.json(); }
function fillKey(f){ const st=Math.abs(+f.startPosition); const closing=f.dir.startsWith("Close")||f.dir.includes(">"); return [f.time,f.coin,f.oid,closing?-st:st]; }
function cmpKey(a,b){ const A=fillKey(a),B=fillKey(b); for(let i=0;i<4;i++){ if(A[i]<B[i]) return -1; if(A[i]>B[i]) return 1;} return 0; }
async function fetchRaw(days){
  const now=Date.now(); let cursor=now-days*86400000; const seen=new Map();
  for(let i=0;i<50;i++){ const b=await q({type:"userFillsByTime",user:ADDRESS,startTime:cursor,endTime:now,aggregateByTime:false}); if(!b.length) break; b.forEach(f=>seen.set(f.tid+"|"+f.oid+"|"+f.time,f)); if(b.length<2000) break; cursor=Math.max(...b.map(f=>f.time))+1; }
  const raw={fills:[...seen.values()].sort(cmpKey),historicalOrders:await q({type:"historicalOrders",user:ADDRESS}),states:{},openOrders:[],mids:{},spot:await q({type:"spotClearinghouseState",user:ADDRESS})};
  for(const d of DEXES){ const ex=d?{dex:d}:{}; raw.states[d||"main"]=await q({type:"clearinghouseState",user:ADDRESS,...ex}); raw.openOrders.push(...await q({type:"frontendOpenOrders",user:ADDRESS,...ex})); try{ Object.assign(raw.mids, await q({type:"allMids",...ex})); }catch(e){} }
  return raw;
}
function build(raw, days){
  const fills=[...raw.fills].sort(cmpKey); const orders=new Map();
  for(const h of raw.historicalOrders){ const o=h.order; let cur=orders.get(o.oid); if(!cur){ cur={...o,statuses:[]}; orders.set(o.oid,cur);} cur.statuses.push(h.status);
    if(o.isTrigger && +o.triggerPx>0){ cur.isTrigger=true; cur.triggerPx=o.triggerPx; } cur.timestamp=Math.min(cur.timestamp,o.timestamp); }
  for(const o of raw.openOrders) if(!orders.has(o.oid)) orders.set(o.oid,{...o,statuses:["open"]});
  const stopsBy={}; for(const o of orders.values()) if((o.orderType||"").startsWith("Stop")&&o.isTrigger) (stopsBy[o.coin]??=[]).push(o);
  const kind=oid=>(orders.get(oid)||{}).orderType||"";
  const trips=[], live={};
  const nt=(coin,side,t,partial=false)=>({coin,side,open_ms:t,close_ms:null,opens:[],closes:[],fees:0,gross:0,max_size:0,partial_history:partial});
  for(const f of fills){
    const coin=f.coin, s=+f.sz, p=+f.px, fee=+f.fee, cp=+f.closedPnl, start=+f.startPosition, delta=f.side==="B"?s:-s, end=start+delta;
    let tr=live[coin];
    if(!tr && Math.abs(start)>EPS){ tr=live[coin]=nt(coin,start>0?"long":"short",f.time,true); tr.max_size=Math.abs(start); }
    const flip=Math.abs(start)>EPS&&Math.abs(end)>EPS&&((start>0)!==(end>0));
    if(flip){ const cs=Math.abs(start), os=Math.abs(end), share=cs/s;
      tr.closes.push({px:p,sz:cs,ms:f.time,oid:f.oid,kind:kind(f.oid)}); tr.fees+=fee*share; tr.gross+=cp; tr.close_ms=f.time; trips.push(tr);
      tr=live[coin]=nt(coin,end>0?"long":"short",f.time); tr.opens.push({px:p,sz:os,ms:f.time,oid:f.oid}); tr.fees+=fee*(1-share); tr.max_size=os; continue; }
    if(!tr) tr=live[coin]=nt(coin,delta>0?"long":"short",f.time);
    const leg={px:p,sz:s,ms:f.time,oid:f.oid};
    if(Math.abs(end)>Math.abs(start)+EPS) tr.opens.push(leg); else { leg.kind=kind(f.oid); tr.closes.push(leg); tr.close_ms=f.time; }
    tr.fees+=fee; tr.gross+=cp; tr.max_size=Math.max(tr.max_size,Math.abs(end));
    if(Math.abs(end)<EPS){ trips.push(tr); delete live[coin]; }
  }
  const vwap=l=>{ const t=l.reduce((a,x)=>a+x.sz,0); return t>EPS?l.reduce((a,x)=>a+x.px*x.sz,0)/t:null; };
  const r2=v=>Math.round(v*100)/100;
  function finish(tr,isOpen){
    const entry=vwap(tr.opens), exitp=vwap(tr.closes), stopSide=tr.side==="long"?"A":"B";
    const horizon=(tr.close_ms&&!isOpen)?tr.close_ms:Date.now();
    const placed=tr.opens.filter(o=>orders.has(o.oid)).map(o=>orders.get(o.oid).timestamp);
    const lo=Math.min(...placed,tr.open_ms)-5000; const cs=stopsBy[tr.coin]||[];
    let cands=cs.filter(s=>s.side===stopSide&&s.timestamp>=lo&&s.timestamp<=horizon);
    const coids=new Set(tr.closes.map(c=>c.oid)); const hit=cs.filter(s=>coids.has(s.oid));
    if(isOpen){ const o=cands.filter(s=>s.statuses.every(x=>x==="open")); if(o.length) cands=o; }
    const stop=hit[0]||(cands.length?cands.reduce((a,b)=>b.timestamp>a.timestamp?b:a):null);
    const first=cands.length?cands.reduce((a,b)=>b.timestamp<a.timestamp?b:a):stop;
    const stopPx=stop?+stop.triggerPx:null, initPx=first?+first.triggerPx:null;
    const riskAt=x=>{ if(!x||!entry) return null; const per=tr.side==="long"?entry-x:x-entry; return r2(Math.max(per,0)*tr.max_size); };
    const ir=riskAt(initPx), fr=riskAt(stopPx); const vals=[ir,fr].filter(v=>v!=null); const risk=vals.length?Math.max(...vals):null;
    const kinds=tr.closes.map(c=>c.kind||""); let et=null;
    if(kinds.some(k=>k.startsWith("Stop"))) et="SL"; else if(kinds.some(k=>k.startsWith("Take"))) et="TP"; else if(kinds.includes("Market")) et="Market"; else if(tr.closes.length) et="Limit";
    const net=tr.gross-tr.fees;
    const d={coin:tr.coin,side:tr.side,size:tr.max_size,entry,exit:exitp,stop:stopPx,risk,initial_stop:initPx,initial_risk:ir,final_risk:fr,
      fees:tr.fees,gross:tr.gross,net,r_mult:(risk&&risk>0.01&&!isOpen)?r2(net/risk):null,open_ms:tr.open_ms,close_ms:isOpen?null:tr.close_ms,
      open_et:etStr(tr.open_ms),close_et:isOpen?null:etStr(tr.close_ms),exit_type:et,n_fills:tr.opens.length+tr.closes.length,partial_history:tr.partial_history,status:isOpen?"open":"closed"};
    if(!isOpen){ d.result=net>0.005?"WIN":(net<-0.005?"LOSS":"BE"); d.day=etDay(tr.close_ms); }
    return d;
  }
  const closed=trips.map(t=>finish(t,false));
  const positions=[]; let upnl=0;
  for(const st of Object.values(raw.states)) for(const ap of st.assetPositions||[]){ const p=ap.position, szi=+p.szi; if(Math.abs(szi)<EPS) continue;
    const up=+p.unrealizedPnl; upnl+=up; const base=live[p.coin]?finish(live[p.coin],true):{coin:p.coin,side:szi>0?"long":"short",open_et:null,fees:0,gross:0,stop:null,risk:null};
    const tps=raw.openOrders.filter(o=>o.coin===p.coin&&(o.orderType||"").startsWith("Take"));
    Object.assign(base,{size:Math.abs(szi),entry:+p.entryPx,upnl:up,mark:+(raw.mids[p.coin]||0)||null,liq:p.liquidationPx?+p.liquidationPx:null,leverage:`${p.leverage.value}x ${p.leverage.type}`,target:tps.length?+tps[0].triggerPx:null,funding_since_open:-(+p.cumFunding.sinceOpen)});
    if(base.stop){ const per=base.side==="long"?base.entry-base.stop:base.stop-base.entry; base.risk=r2(Math.max(per,0)*Math.abs(szi)); }
    base.net_if_closed_now=up-(base.fees||0); positions.push(base); }
  const pending=[]; for(const o of raw.openOrders){ if(o.isTrigger||o.reduceOnly) continue; const k=o.children||[];
    const sl=k.find(c=>(c.orderType||"").startsWith("Stop")), tp=k.find(c=>(c.orderType||"").startsWith("Take")); const p=+o.limitPx, s=+o.sz;
    pending.push({coin:o.coin,side:o.side==="B"?"long":"short",size:s,entry:p,stop:sl?+sl.triggerPx:null,target:tp?+tp.triggerPx:null,planned_risk:sl?r2(Math.abs(p-sl.triggerPx)*s):null,planned_reward:tp?r2(Math.abs(tp.triggerPx-p)*s):null,placed_et:etStr(o.timestamp),mark:+(raw.mids[o.coin]||0)||null}); }
  const daysMap={}; for(const t of closed){ const d=daysMap[t.day]??={net:0,gross:0,fees:0,trades:0,wins:0,losses:0,risk:0}; d.net+=t.net; d.gross+=t.gross; d.fees+=t.fees; d.trades++; d.wins+=t.result==="WIN"; d.losses+=t.result==="LOSS"; d.risk+=t.risk||0; }
  const now=Date.now(), today=etDay(now); const p=etParts(now); const wd=(new Date(Date.UTC(+p.year,+p.month-1,+p.day)).getUTCDay()+6)%7;
  const wkStart=etDay(Date.UTC(+p.year,+p.month-1,+p.day-wd,12)); const moStart=`${p.year}-${p.month}-01`;
  const ssum=fr=>r2(Object.entries(daysMap).filter(([k])=>k>=fr&&k<=today).reduce((a,[,v])=>a+v.net,0));
  const wins=closed.filter(t=>t.result==="WIN").length, losses=closed.filter(t=>t.result==="LOSS").length;
  const usdc=((raw.spot.balances||[]).find(b=>b.coin==="USDC")||{}).total;
  return {address:ADDRESS,network:"mainnet",generated_ms:now,generated_et:etStr(now),history_days:days,history_from_et:fills.length?etStr(fills[0].time):null,
    kpis:{today:ssum(today),week:ssum(wkStart),mtd:ssum(moStart),all_time:r2(closed.reduce((a,t)=>a+t.net,0)),win_rate:wins+losses?Math.round(1000*wins/(wins+losses))/10:null,wins,losses,closed:closed.length,
      open_upnl:r2(upnl),equity_spot_usdc:usdc!=null?+usdc:null,perp_account_value:r2(Object.values(raw.states).reduce((a,s)=>a+ +s.marginSummary.accountValue,0)),today_key:today,week_start:wkStart},
    days:daysMap,trades:closed.sort((a,b)=>a.close_ms-b.close_ms),positions,pending};
}

/* ---------- render ---------- */
function kpi(lbl,val,sub,c){ return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val ${c??""}">${val}</div><div class="sub">${sub??""}</div></div>`; }
function renderKpis(){ const k=BOARD.kpis; const td=BOARD.days[k.today_key]||{trades:0,wins:0,losses:0};
  $("kpis").innerHTML=[
    kpi("Today (realized)",money(k.today),`${td.trades} closed · ${td.wins}W/${td.losses}L`,cls(k.today)),
    kpi("This week",money(k.week),`since Mon ${k.week_start.slice(5)}`,cls(k.week)),
    kpi("Month to date",money(k.mtd),`all history ${money(k.all_time)}`,cls(k.mtd)),
    kpi("Win rate (closed)",k.win_rate==null?"—":k.win_rate.toFixed(1)+"%",`${k.wins}W / ${k.losses}L · ${k.closed} trades`,""),
    kpi("Open uPnL",money(k.open_upnl),`${BOARD.positions.length} open · ${BOARD.pending.length} resting`,cls(k.open_upnl)),
    kpi("Account equity",money(k.equity_spot_usdc,false),`spot USDC total · perp margin ${money(k.perp_account_value,false)}`,"")].join("");
}
function ym(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }
function renderCal(){
  const [y,m]=VIEW; $("monLbl").textContent=new Date(Date.UTC(y,m-1,15)).toLocaleString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
  const first=new Date(Date.UTC(y,m-1,1)); const lead=(first.getUTCDay()+6)%7; const dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const today=BOARD.kpis.today_key; const cells=Math.ceil((lead+dim)/7)*7;
  let h=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")+`<div class="dow wk">Week</div>`;
  let wk={net:0,trades:0};
  for(let i=0;i<cells;i++){
    const dt=new Date(Date.UTC(y,m-1,1-lead+i)); const key=dt.toISOString().slice(0,10); const inM=dt.getUTCMonth()===m-1;
    const d=BOARD.days[key]; const isT=key===today; const hasOpen=isT&&(BOARD.positions.length||BOARD.pending.length);
    let c="cell"+(inM?"":" out")+(isT?" today":"")+(d?(" has "+(d.net>0.005?"win":(d.net<-0.005?"loss":""))):" empty")+(hasOpen&&!d?" has":"");
    h+=`<div class="${c}" data-day="${key}"><div class="dn"><b>${dt.getUTCDate()}</b>${isT?'<span class="amber">TODAY</span>':""}</div>`;
    if(d){ h+=`<div class="cnt">${d.trades} trade${d.trades>1?"s":""} · ${d.wins}W/${d.losses}L</div>`; wk.net+=d.net; wk.trades+=d.trades; }
    if(hasOpen) h+=`<div class="live ${cls(BOARD.kpis.open_upnl)}">open ${money(BOARD.kpis.open_upnl)}</div>`;
    h+=`<div class="pnl ${d?cls(d.net):""}">${d?money(d.net):(inM?"·":"")}</div></div>`;
    if(i%7===6){ h+=`<div class="wk"><div class="l">Week net</div><div class="v ${wk.trades?cls(wk.net):"dim"}">${wk.trades?money(wk.net):"—"}</div><div class="cnt dim mono" style="font-size:10px">${wk.trades} trades</div></div>`; wk={net:0,trades:0}; }
  }

function pill(r){ const c=r==="WIN"?"win":r==="LOSS"?"loss":r==="OPEN"?"open":"be"; return `<span class="pill ${c}">${r}</span>`; }
function riskCell(t){ if(t.risk==null) return '<span class="dim">—</span>'; let s=money(t.risk,false);
  if(t.initial_risk!=null&&t.final_risk!=null&&Math.abs(t.initial_risk-t.final_risk)>0.05) s+=` <span class="dim rsub" title="initial stop ${px(t.initial_stop)} → final stop ${px(t.stop)}">(${money(t.initial_risk,false)}→${money(t.final_risk,false)})</span>`;
  return s; }
function tradesTable(list){

  list.map(t=>`<tr><td>${coinLbl(t.coin)}${t.partial_history?' <span class="amber" title="opened before history window">*</span>':""}</td><td class="side-${t.side}">${t.side.toUpperCase()}</td><td class="num">${sz(t.size)}</td><td class="num">${px(t.entry)}</td><td class="num">${px(t.exit)}</td><td class="num">${px(t.stop)}</td><td class="num">${riskCell(t)}</td><td class="num neg">${money(-t.fees)}</td><td class="num ${cls(t.gross)}">${money(t.gross)}</td><td class="num ${cls(t.net)}"><b>${money(t.net)}</b></td><td class="num ${cls(t.r_mult)}">${t.r_mult==null?"—":(t.r_mult>0?"+":"")+t.r_mult.toFixed(2)+"R"}</td><td class="mono dim">${t.exit_type||"—"}</td><td>${pill(t.result)}</td><td class="mono dim">${t.open_et.slice(5)}</td><td class="mono dim">${t.close_et.slice(5)}</td></tr>`).join("")+`</tbody></table></div>`;

function openTable(){
  let h=""; const P=BOARD.positions, R=BOARD.pending;

  if(R.length) h+=`<div style="height:.6rem"></div><div class="tbl"><table><thead><tr><th>Resting entry</th><th>Side</th><th class="num">Size</th><th class="num">Limit</th><th class="num">Mark</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Planned risk</th><th class="num">Planned reward</th><th class="num">R:R</th><th>Placed ET</th></tr></thead><tbody>`+

function openDay(day){

  const dt=new Date(day+"T12:00:00Z"); $("drTitle").innerHTML=`${dt.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"})} ${isT?'<span class="badge warn">TODAY</span>':""}`;
  const wr=d&&(d.wins+d.losses)?(100*d.wins/(d.wins+d.losses)).toFixed(0)+"%":"—";
  let h=`<div class="stat-row">
    <div><div class="l">Net PnL</div><div class="v ${cls(d?.net)}">${money(d?.net??0)}</div></div>

  h+=`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">Closed trades (by close time ET)</div>${tradesTable(list)}</div>`;

function closeDay(){ OPEN_DAY=null; $("drawer").classList.remove("on"); $("ov").classList.remove("on"); }
function render(){
  if(!BOARD){ $("kpis").innerHTML='<div class="empty">No data yet.</div>'; return; }
  if(!VIEW){ const [y,m]=BOARD.kpis.today_key.split("-").map(Number); VIEW=[y,m]; }
  $("addr").textContent=ADDRESS.slice(0,6)+"…"+ADDRESS.slice(-4);
  renderKpis(); renderCal(); $("openBox").innerHTML=openTable();
  const live=SOURCE==="live"; $("srcBadge").textContent=live?"LIVE":"SNAPSHOT"; $("srcBadge").className="badge"+(live?"":" warn");
  $("dot").className="dot"+(live?"":" stale"); $("upd").textContent=`${live?"live":"snapshot"} · ${BOARD.generated_et} ET`;
  $("foot").innerHTML=`Source: Hyperliquid public info API (fills, historical orders, positions) for <code class="mono">${ADDRESS}</code>. History from ${BOARD.history_from_et||"—"} ET (${BOARD.history_days}d window). `+
   `Trades are round trips per coin (flat → flat), dated by close time in America/Toronto. Net = closed PnL − all entry/exit fees (funding not included). `+
   `Risk = |entry − stop| × max size, using the widest stop the trade carried (initial→final shown when it moved); “—” = no stop order found. R = net ÷ risk. `+
   `<span class="amber">*</span> = position opened before the history window. Account equity = spot USDC total (unified account). Auto-refresh every 60s.`;
  if(OPEN_DAY) openDay(OPEN_DAY);
}
async function refresh(){

  try{ BOARD=build(await fetchRaw(BOARD?.history_days||90),BOARD?.history_days||90); SOURCE="live"; }
  catch(e){ console.warn("live API failed, trying calendar.json",e);
    try{ const r=await fetch("calendar.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok){ BOARD=await r.json(); SOURCE="snapshot"; } }catch(e2){} }
  $("refresh").disabled=false; render();
}
$("refresh").onclick=refresh; $("drClose").onclick=closeDay; $("ov").onclick=closeDay; document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDay(); });
