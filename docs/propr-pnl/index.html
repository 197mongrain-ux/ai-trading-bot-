    let c="cell"+(inM?"":" out")+(isT?" today":"")+(d?(" has "+(d.net>0.005?"win":(d.net<-0.005?"loss":""))):" empty")+(hasOpen&&!d?" has":"");
    h+=`<div class="${c}" data-day="${key}"><div class="dn"><b>${dt.getUTCDate()}</b>${isT?'<span class="amber">TODAY</span>':""}</div>`;
    if(d){ h+=`<div class="cnt">${d.trades} trade${d.trades>1?"s":""} · ${d.wins}W/${d.losses}L</div>`; wk.net+=d.net; wk.trades+=d.trades; }
    if(d&&d.best!=null) h+=`<div class="cnt mono" style="font-size:10px">best <span class="${cls(d.best)}">${money(d.best)}</span>${d.trades>1?` / worst <span class="${cls(d.worst)}">${money(d.worst)}</span>`:""}</div>`;
    if(hasOpen) h+=`<div class="live ${cls(K.open_upnl)}">open ${money(K.open_upnl)}</div>`;
    h+=`<div class="pnl ${d?cls(d.net):""}">${d?money(d.net):(inM?"·":"")}</div></div>`;
    if(i%7===6){ h+=`<div class="wk"><div class="l">Week net</div><div class="v ${wk.trades?cls(wk.net):"dim"}">${wk.trades?money(wk.net):"—"}</div><div class="cnt dim mono" style="font-size:10px">${wk.trades} trades</div></div>`; wk={net:0,trades:0}; }
  }
  $("cal").innerHTML=h;
  $("cal").querySelectorAll(".cell.has").forEach(el=>el.onclick=()=>openDay(el.dataset.day));
}
function pill(r){ const c=r==="WIN"?"win":r==="LOSS"?"loss":r==="OPEN"?"open":"be"; return `<span class="pill ${c}">${r}</span>`; }
function riskCell(t){ if(t.risk==null) return '<span class="dim">—</span>'; let s=money(t.risk,false);
  if(t.initial_risk!=null&&t.final_risk!=null&&Math.abs(t.initial_risk-t.final_risk)>0.05) s+=` <span class="dim rsub" title="initial stop ${px(t.initial_stop)} → final stop ${px(t.stop)}">(${money(t.initial_risk,false)}→${money(t.final_risk,false)})</span>`;
  return s; }
const rfmt=v=>v==null?"—":(v>0?"+":"")+v.toFixed(2)+"R";
function tradesTable(list){
  if(!list.length) return '<div class="empty">No closed trades.</div>';
  return `<div class="tbl"><table><thead><tr><th>Asset</th><th>Side</th><th class="num">Size</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Risk $</th><th class="num">Fees</th><th class="num">Funding</th><th class="num">Gross</th><th class="num">Net</th><th class="num">R (net)</th><th class="num">R (gross)</th><th>Exit</th><th>Result</th><th>Open ET</th><th>Close ET</th></tr></thead><tbody>`+
  list.map(t=>`<tr><td>${esc(t.coin)}</td><td class="side-${t.side}">${t.side.toUpperCase()}</td><td class="num">${sz(t.size)}</td><td class="num">${px(t.entry)}</td><td class="num">${px(t.exit)}</td><td class="num">${px(t.stop)}</td><td class="num">${px(t.target)}</td><td class="num">${riskCell(t)}</td><td class="num neg" title="open ${money(-t.fee_open,false)} + close ${money(-t.fee_close,false)}">${money(-t.fees)}</td><td class="num ${cls(t.funding)}">${money(t.funding)}</td><td class="num ${cls(t.gross)}">${money(t.gross)}</td><td class="num ${cls(t.net)}"><b>${money(t.net)}</b></td><td class="num ${cls(t.r_mult)}">${rfmt(t.r_mult)}</td><td class="num ${cls(t.r_gross)}">${rfmt(t.r_gross)}</td><td class="mono dim">${esc(t.exit_type||"—")}</td><td>${pill(t.result)}</td><td class="mono dim">${t.open_et.slice(5)}</td><td class="mono dim">${t.close_et.slice(5)}</td></tr>`).join("")+`</tbody></table></div>`;
}
function journalCards(list){
  if(!list.length) return "";
  return list.slice().sort((a,b)=>b.close_ms-a.close_ms).map(t=>{
    const note=t.note||"No notes recorded", empty=note==="No notes recorded";
    return `<div class="jcard" id="j-${esc(t.id)}"><div class="jh"><b>${esc(t.coin)}</b> <span class="side-${t.side}">${t.side.toUpperCase()}</span> ${pill(t.result)} <span class="dim mono">${t.open_et.slice(5)} → ${t.close_et.slice(5)} ET</span> <a class="mono dim" href="journal/#${esc(t.id)}" style="margin-left:auto">#${esc(t.id)} · open in journal ↗</a></div>
    <a href="journal/#${esc(t.id)}"><img class="jimg" loading="lazy" src="${esc(t.img)}" alt="${esc(t.id)} chart" onerror="this.style.display='none'"></a>
    <div class="jgrid"><div><div class="l">Entry → Exit</div><div class="v mono">${px(t.entry)} → ${px(t.exit)}</div></div><div><div class="l">Stop / Target</div><div class="v mono">${px(t.initial_stop??t.stop)} / ${px(t.target)}</div></div><div><div class="l">Size</div><div class="v mono">${sz(t.size)}</div></div><div><div class="l">Net (after fees)</div><div class="v mono ${cls(t.net)}">${money(t.net)}</div></div><div><div class="l">R (net / gross)</div><div class="v mono ${cls(t.r_mult)}">${rfmt(t.r_mult)} / ${rfmt(t.r_gross)}</div></div><div><div class="l">Closed by</div><div class="v mono">${esc(t.exit_type||"—")}</div></div></div>
    <div class="jnote${empty?" empty":""}"><div class="l">Setup / entry reasoning &amp; notes</div>${esc(note)}</div></div>`;}).join("");
}
function openTable(){
  let h=""; const P=BOARD.positions, R=BOARD.pending;
  if(P.length) h+=`<div class="tbl"><table><thead><tr><th>Asset</th><th>Side</th><th class="num">Size</th><th class="num">Entry</th><th class="num">Mark</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Risk $</th><th class="num">uPnL</th><th class="num">Fees paid</th><th class="num">Liq</th><th>Lev</th><th>Opened ET</th><th></th></tr></thead><tbody>`+
    P.map(p=>`<tr><td>${esc(p.coin)}</td><td class="side-${p.side}">${p.side.toUpperCase()}</td><td class="num">${sz(p.size)}</td><td class="num">${px(p.entry)}</td><td class="num">${px(p.mark)}</td><td class="num">${px(p.stop)}</td><td class="num">${px(p.target)}</td><td class="num">${p.risk==null?"—":money(p.risk,false)}</td><td class="num ${cls(p.upnl)}"><b>${money(p.upnl)}</b></td><td class="num neg">${money(-(p.fees||0))}</td><td class="num dim">${px(p.liq)}</td><td class="mono dim">${esc(p.leverage)}</td><td class="mono dim">${(p.open_et||"—").slice(5)}</td><td>${pill("OPEN")}</td></tr>`).join("")+`</tbody></table></div>`;
  if(R.length) h+=`<div style="height:.6rem"></div><div class="tbl"><table><thead><tr><th>Resting entry</th><th>Side</th><th class="num">Size</th><th class="num">Limit</th><th class="num">Mark</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Planned risk</th><th class="num">Planned reward</th><th class="num">R:R</th><th>Placed ET</th></tr></thead><tbody>`+
    R.map(p=>`<tr><td>${esc(p.coin)}</td><td class="side-${p.side}">${p.side.toUpperCase()}</td><td class="num">${sz(p.size)}</td><td class="num">${px(p.entry)}</td><td class="num">${px(p.mark)}</td><td class="num">${px(p.stop)}</td><td class="num">${px(p.target)}</td><td class="num">${p.planned_risk==null?"—":money(p.planned_risk,false)}</td><td class="num pos">${p.planned_reward==null?"—":money(p.planned_reward,false)}</td><td class="num">${p.planned_risk&&p.planned_reward?(p.planned_reward/p.planned_risk).toFixed(1)+"R":"—"}</td><td class="mono dim">${p.placed_et.slice(5)}</td></tr>`).join("")+`</tbody></table></div>`;
  return h||'<div class="empty">Flat — no open positions or resting entries.</div>';
}
function openDay(day){
  OPEN_DAY=day; const d=BOARD.days[day]; const list=BOARD.trades.filter(t=>t.day===day); const isT=day===K.today_key;
  const dt=new Date(day+"T12:00:00Z"); $("drTitle").innerHTML=`${dt.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"})} ${isT?'<span class="badge warn">TODAY</span>':""} <span class="badge sim">PROPR (SIMULATED)</span>`;
  const wr=d&&(d.wins+d.losses)?(100*d.wins/(d.wins+d.losses)).toFixed(0)+"%":"—";
  let h=`<div class="stat-row">
    <div><div class="l">Net PnL</div><div class="v ${cls(d?.net)}">${money(d?.net??0)}</div></div>
    <div><div class="l">Gross</div><div class="v ${cls(d?.gross)}">${money(d?.gross??0)}</div></div>
    <div><div class="l">Fees</div><div class="v neg">${money(-(d?.fees??0))}</div></div>
    <div><div class="l">Funding</div><div class="v ${cls(d?.funding)}">${money(d?.funding??0)}</div></div>
    <div><div class="l">Trades</div><div class="v">${d?.trades??0}</div></div>
    <div><div class="l">Win rate</div><div class="v">${wr}</div></div>
    <div><div class="l">Risk taken</div><div class="v">${d?money(d.risk,false):"—"}</div></div>
    ${isT?`<div><div class="l">Open uPnL</div><div class="v ${cls(K.open_upnl)}">${money(K.open_upnl)}</div></div>`:""}</div>`;
  h+=`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">Closed trades (by close time ET)</div>${tradesTable(list)}</div>`;
  if(list.length) h+=`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">Journal · <a href="journal/" style="color:inherit">all Propr trades ↗</a></div>${journalCards(list)}</div>`;
  if(isT) h+=`<div><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">Still open now</div>${openTable()}</div>`;
  $("drBody").innerHTML=h; $("drawer").classList.add("on"); $("ov").classList.add("on");
}
function closeDay(){ OPEN_DAY=null; $("drawer").classList.remove("on"); $("ov").classList.remove("on"); }
/* ---------- all-time performance (shared ../assets/perf.js) ---------- */
function renderPerf(){
  if(!window.PERF) return; const C=BOARD.challenge||{};
  const T=BOARD.trades.map(t=>({day:t.day,close_ms:t.close_ms,open_et:t.open_et,close_et:t.close_et,coin:t.coin,side:t.side,v:t.net,r:t.r_mult,fees:t.fees,href:"journal/#"+t.id}));
  const days=new Set(T.map(t=>t.day)).size, allow=(C.hwm-C.dd_floor)||1, prog=C.target_usd?100*Math.max(0,C.progress_usd)/C.target_usd:0;
  const obj=C.initial?[
    {name:`Profit target +${C.target_pct}% (phase ${C.phase_order})`,kind:"target",limit:`${money(C.target_usd,false)} → ${money(C.target_equity,false)}`,result:`${money(C.progress_usd)} (${(100*C.progress_usd/C.initial).toFixed(2)}%)`,used:prog,status:C.progress_usd>=C.target_usd?"Passed":"Ongoing",note:`${money(Math.max(0,C.target_equity-C.equity),false)} still needed · balance must reach target with positions flat`},
    {name:`Max daily loss ${C.dl_pct}% of start-of-day`,limit:`−${money(C.daily_limit,false)}`,result:`today ${money(C.today_pnl)}`,used:100*Math.max(0,C.daily_limit-C.daily_distance)/C.daily_limit,status:C.daily_distance>0?"Safe":"Breached",note:`floor ${money(C.daily_floor,false)} · ${money(C.daily_distance,false)} away · resets ${C.next_reset_et} ET (00:00 UTC)`},
    {name:`Max drawdown ${C.dd_pct}% trailing`,limit:`−${money(allow,false)}`,result:`${money(C.equity-C.hwm)} from peak`,used:100*Math.max(0,allow-C.dd_distance)/allow,status:C.dd_distance>0?"Safe":"Breached",note:`floor ${money(C.dd_floor,false)} (HWM ${money(C.hwm,false)}) · ${money(C.dd_distance,false)} away · floor never above ${money(C.initial,false)}`},
    {name:"Trading days",kind:"target",limit:"no minimum",result:`${days} day${days===1?"":"s"}`,used:100,status:"Passed",note:"no time limit on this phase"}]:null;
  const o={unit:"$",start:C.initial||null,today:K.today_key,trades:T,objectives:obj,objTitle:`${C.name||"Propr"} · phase ${C.phase_order??"?"} of ${C.phase_count??"?"} · ${C.status||""}`,
    alt:S=>`balance <b>${money(C.balance,false)}</b> · equity ${money(C.equity,false)} · ${prog.toFixed(1)}% of the way to ${money(C.target_equity,false)}`+(Math.abs((C.balance-C.initial)-S.net)>0.05?` · <span class="amber">trade sum differs from balance by ${money((C.balance-C.initial)-S.net)}</span>`:` · trades reconcile to balance ✓`),
    note:`All-time = every closed Propr position since ${T.length?T.map(t=>t.day).sort()[0]:"—"} (net = gross − fees + funding). Drawdown here is on closed PnL; the challenge objectives above use live equity like Propr does. Sessions/weekday use entry time in America/Toronto.`};
  PERF.top($("perfTop"),o); PERF.bottom($("perfBot"),o);
}
function render(){
  if(!BOARD){ $("kpis").innerHTML='<div class="empty">No data yet.</div>'; return; }
  K=kp();
  if(!VIEW){ const [y,m]=K.today_key.split("-").map(Number); VIEW=[y,m]; }
  const C=BOARD.challenge||{}; $("sub").textContent=`${C.name||"Propr"} · $${(C.initial||0).toLocaleString("en-US")} · simulated`;
  renderPerf(); renderChallenge(); renderKpis(); renderCal(); $("openBox").innerHTML=openTable();
  $("srcBadge").textContent="SNAPSHOT"; $("srcBadge").className="badge warn"; $("dot").className="dot"+(SOURCE==="fresh"?"":" stale");
  $("upd").textContent=`built ${BOARD.generated_et} ET`;
  $("foot").innerHTML=`<b class="amber">PROPR evaluation (simulated).</b> Only trades from the Propr evaluation account are on this board; Hyperliquid mainnet trades are on a separate board. `+
   `Source: Propr API (executions, positions, orders), rebuilt by <code class="mono">build_propr_board.py</code>; this page is a snapshot generated ${BOARD.generated_et} ET and re-reads <code class="mono">calendar.json</code> every 60s, so it is only as fresh as the last rebuild. `+
   `Trades are positions (open → flat), dated by close time in America/Toronto. Net = gross realized PnL − all entry/exit fees + funding; this matches the account balance. `+
   `Risk = |entry − initial stop| × size. R (net) = net ÷ risk; R (gross) = gross ÷ risk (the figure Propr reports). `+
   `Max drawdown floor = high-water mark − ${C.dd_pct}% of the starting balance (trailing, never above the starting balance); daily loss floor = start-of-day balance (00:00 UTC) − ${C.dl_pct}%, both equity-based. Start-of-day balance is reconstructed from fills.`;
  if(OPEN_DAY) openDay(OPEN_DAY);
}
async function refresh(){
  $("refresh").disabled=true; $("upd").textContent="refreshing…";
  try{ const r=await fetch("calendar.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok){ BOARD=await r.json(); SOURCE="fresh"; } }catch(e){}
  $("refresh").disabled=false; render();
}
$("refresh").onclick=refresh; $("drClose").onclick=closeDay; $("ov").onclick=closeDay; document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDay(); });
$("prev").onclick=()=>{ let [y,m]=VIEW; m--; if(m<1){m=12;y--;} VIEW=[y,m]; renderCal(); };
$("next").onclick=()=>{ let [y,m]=VIEW; m++; if(m>12){m=1;y++;} VIEW=[y,m]; renderCal(); };
$("todayBtn").onclick=()=>{ VIEW=null; render(); };
const hd=(location.hash.match(/day=(\d{4}-\d{2}-\d{2})/)||[])[1]; if(hd) OPEN_DAY=hd;
render(); refresh(); setInterval(refresh,REFRESH_MS);
</script>
